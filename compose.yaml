services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Rootless Docker maps container root to the host user that owns the Docker socket.
    user: "0:0"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ./cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./data/cliproxy-auths:/root/.cli-proxy-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
